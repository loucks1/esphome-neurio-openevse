substitutions:
  name: "esphome-neurio-openevse"
  friendly_name: "Neurio OpenEVSE Bridge"
  neurio_ip: "192.168.1.150"  # Replace with your Neurio LAN IP
  mqtt_broker: "192.168.1.10"  # Replace with your MQTT broker IP

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0

esp32:
  board: esp32dev
  framework:
    # esp-idf is required for bluetooth_proxy. The component also builds as Arduino;
    # see examples/esp32-arduino.yaml. A device that already runs BLE proxy should
    # stay on esp-idf: examples/rf433sniffer-esp-idf.yaml.
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  fast_connect: true

  ap:
    ssid: "Neurio-EVSE-Fallback"
    password: "fallbackpassword"

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: "UTC"

mqtt:
  broker: ${mqtt_broker}
  port: 1883
  username: "mqtt_user"
  password: "YOUR_MQTT_PASSWORD"
  keepalive: 15s
  discovery: false

# Optional local sun gate. Omit sun: and sun_id to use only the feed switch.
# sun:
#   id: sun_site
#   latitude: 0.0
#   longitude: 0.0

neurio_evse:
  id: neurio_hub
  neurio_host: ${neurio_ip}
  poll_interval: 2s              # Also valid: 5s (OpenEVSE prefers updates every 5–10s)
  mqtt_openevse_topic: "openevse/grid/power"
  mqtt_raw_topic: "neurio/raw"
  mqtt_hourly_topic: "neurio/hourly/energy"
  mqtt_ack_topic: "neurio/hourly/ack"
  mqtt_queue_status_topic: "neurio/queue/status"
  retry_interval: 5min
  require_hourly_ack: true
  persistence_mode: in_memory_first
  ack_timeout: 30s
  backoff_interval: 10s
  socket_recycle_count: 60
  openevse_when_gated: import_sentinel
  openevse_gated_power: 50000
  # sun_id: sun_site
  # openevse_min_elevation: 0.0
  time_id: sntp_time

switch:
  - platform: neurio_evse
    neurio_evse_id: neurio_hub
    require_hourly_ack:
      name: "Require Hourly ACK"
      id: sw_require_ack
      icon: "mdi:check-network"
    openevse_feed:
      name: "OpenEVSE feed enabled"
      id: sw_openevse_feed
      icon: "mdi:sun-angle"
      restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: neurio_evse
    neurio_evse_id: neurio_hub
    grid_offset:
      name: "EVSE Grid Power Offset"
      id: evse_offset_watts
      icon: "mdi:tune-vertical"

sensor:
  - platform: neurio_evse
    neurio_evse_id: neurio_hub
    net_power:
      name: "Neurio Net Power"
      icon: "mdi:transmission-tower"
    generation_power:
      name: "Neurio Solar Generation"
      icon: "mdi:solar-power"
    consumption_power:
      name: "Neurio Home Consumption"
      icon: "mdi:home-lightning-bolt"
    phase_a_power:
      name: "Neurio Phase A Power"
    phase_b_power:
      name: "Neurio Phase B Power"
    reported_evse_power:
      name: "Reported OpenEVSE Power"
      icon: "mdi:ev-station"
    phase_a_voltage:
      name: "Phase A Voltage"
    phase_b_voltage:
      name: "Phase B Voltage"
    queue_pending_count:
      name: "Hourly Outage Backlog Count"
      icon: "mdi:tray-alert"
    net_import_energy:
      name: "Neurio Net Energy Import"
      icon: "mdi:transmission-tower-import"
    net_export_energy:
      name: "Neurio Net Energy Export"
      icon: "mdi:transmission-tower-export"
    generation_energy:
      name: "Neurio Solar Lifetime Generation"
      icon: "mdi:solar-power"
    consumption_energy:
      name: "Neurio Lifetime Consumption"
      icon: "mdi:home-lightning-bolt"
